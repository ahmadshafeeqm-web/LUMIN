[build]
  command = "npm run build"
  publish = "dist"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[[redirects]]
  from = "/Lumin.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/Lumin"
  to = "/"
  status = 301
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
